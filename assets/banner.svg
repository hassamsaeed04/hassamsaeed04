<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Hassam Saeed — UI/UX Designer, AI-Augmented Product Design">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0716"/>
      <stop offset="55%" stop-color="#140B2E"/>
      <stop offset="100%" stop-color="#1B0F3B"/>
    </linearGradient>
    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#A259FF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="340" rx="24"/></clipPath>
    <style>
      .float1 { animation: f1 9s ease-in-out infinite; }
      .float2 { animation: f2 11s ease-in-out infinite; }
      .float3 { animation: f3 13s ease-in-out infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .node   { animation: pulse 2.4s ease-in-out infinite; }
      .n2 { animation-delay: .8s; } .n3 { animation-delay: 1.6s; }
      .dash   { stroke-dasharray: 6 8; animation: flow 3s linear infinite; }
      @keyframes f1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,20px); } }
      @keyframes f2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px,-15px); } }
      @keyframes f3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(25px,-25px); } }
      @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle class="float1" cx="980" cy="70"  r="230" fill="url(#orbA)"/>
    <circle class="float2" cx="1120" cy="300" r="170" fill="url(#orbB)"/>
    <circle class="float3" cx="140" cy="330" r="190" fill="url(#orbC)"/>

    <!-- eyebrow chip -->
    <g transform="translate(72,74)">
      <rect width="300" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
      <circle cx="20" cy="17" r="5" fill="#34D399"/>
      <circle class="node" cx="20" cy="17" r="9" fill="none" stroke="#34D399" stroke-opacity=".6"/>
      <text x="36" y="22.5" font-size="14" font-weight="600" fill="#E5E7EB" letter-spacing=".4">Open to freelance &amp; remote roles</text>
    </g>

    <!-- name -->
    <text x="70" y="178" font-size="68" font-weight="800" fill="url(#title)" letter-spacing="-1.5">Hassam Saeed</text>
    <rect class="cursor" x="552" y="128" width="5" height="58" rx="2" fill="#A78BFA"/>

    <!-- role -->
    <text x="72" y="222" font-size="23" font-weight="500" fill="#C9C3DC">UI/UX Designer · AI-Augmented Product Design</text>

    <!-- Claude × Figma chip -->
    <g transform="translate(72,250)">
      <rect width="262" height="42" rx="21" fill="url(#chip)"/>
      <text x="131" y="27" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF" letter-spacing=".3">Claude  ×  Figma MCP</text>
    </g>
    <text x="352" y="277" font-size="16" fill="#9CA3AF">4+ years · Web &amp; Mobile · Remote</text>

    <!-- agentic flow motif -->
    <g transform="translate(780,92)">
      <path class="dash" d="M70 52 C 150 52, 150 140, 230 140" fill="none" stroke="#C4B5FD" stroke-opacity=".7" stroke-width="2"/>
      <path class="dash" d="M70 52 C 150 52, 150 -20, 230 -20" fill="none" stroke="#FDBA74" stroke-opacity=".6" stroke-width="2"/>
      <path class="dash" d="M300 8 C 318 50, 318 70, 300 112" fill="none" stroke="#67E8F9" stroke-opacity=".6" stroke-width="2"/>

      <g>
        <rect x="0" y="22" width="140" height="60" rx="14" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".18"/>
        <circle class="node" cx="22" cy="52" r="6" fill="#D97757"/>
        <text x="38" y="57" font-size="15" font-weight="600" fill="#F3F4F6">Prompt</text>
      </g>
      <g>
        <rect x="200" y="-48" width="150" height="56" rx="14" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".18"/>
        <circle class="node n2" cx="222" cy="-20" r="6" fill="#A259FF"/>
        <text x="238" y="-15" font-size="15" font-weight="600" fill="#F3F4F6">Figma</text>
      </g>
      <g>
        <rect x="200" y="112" width="140" height="56" rx="14" fill="#FFFFFF" fill-opacity=".07" stroke="#FFFFFF" stroke-opacity=".18"/>
        <circle class="node n3" cx="222" cy="140" r="6" fill="#22D3EE"/>
        <text x="238" y="145" font-size="15" font-weight="600" fill="#F3F4F6">Code</text>
      </g>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="339" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
  </g>
</svg>
