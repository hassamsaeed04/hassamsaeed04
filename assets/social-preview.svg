<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0716"/>
      <stop offset="55%" stop-color="#140B2E"/>
      <stop offset="100%" stop-color="#1B0F3B"/>
    </linearGradient>
    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#EDE4FF"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97757"/>
      <stop offset="100%" stop-color="#A259FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>text { font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif; }</style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1060" cy="120" r="360" fill="url(#orbA)"/>
  <circle cx="1220" cy="600" r="260" fill="url(#orbB)"/>
  <circle cx="120" cy="620" r="300" fill="url(#orbC)"/>

  <!-- status chip -->
  <g transform="translate(96,118)">
    <rect width="372" height="44" rx="22" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <circle cx="26" cy="22" r="7" fill="#34D399"/>
    <text x="46" y="29" font-size="19" font-weight="600" fill="#E5E7EB">Open to freelance &amp; remote roles</text>
  </g>

  <text x="92" y="276" font-size="100" font-weight="800" fill="url(#title)" letter-spacing="-2.5">Hassam Saeed</text>
  <text x="96" y="340" font-size="34" font-weight="500" fill="#D4CDE8">UI/UX Designer · AI Product Designer</text>

  <!-- chips row -->
  <g transform="translate(96,384)">
    <rect width="300" height="54" rx="27" fill="url(#chip)"/>
    <text x="150" y="35" text-anchor="middle" font-size="21" font-weight="700" fill="#FFFFFF">Claude × Figma MCP</text>
  </g>
  <g transform="translate(412,384)">
    <rect width="250" height="54" rx="27" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="125" y="35" text-anchor="middle" font-size="21" font-weight="600" fill="#F3F4F6">Web &amp; Mobile Apps</text>
  </g>
  <g transform="translate(678,384)">
    <rect width="220" height="54" rx="27" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.18"/>
    <text x="110" y="35" text-anchor="middle" font-size="21" font-weight="600" fill="#F3F4F6">Design Systems</text>
  </g>

  <!-- footer -->
  <line x1="96" y1="516" x2="1184" y2="516" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <text x="96" y="566" font-size="24" font-weight="600" fill="#FFFFFF">github.com/hassamsaeed04</text>
  <text x="1184" y="566" text-anchor="end" font-size="22" fill="#A8A2BD">4+ years · Rawalpindi, Pakistan · Remote</text>

  <!-- flow motif -->
  <g transform="translate(930,150)" opacity="0.95">
    <path d="M110 46 C 170 46, 170 -10, 220 -10" fill="none" stroke="#FDBA74" stroke-opacity=".65" stroke-width="2.5" stroke-dasharray="7 9"/>
    <path d="M110 46 C 170 46, 170 110, 220 110" fill="none" stroke="#C4B5FD" stroke-opacity=".75" stroke-width="2.5" stroke-dasharray="7 9"/>
    <path d="M290 18 C 306 50, 306 60, 290 92" fill="none" stroke="#67E8F9" stroke-opacity=".65" stroke-width="2.5" stroke-dasharray="7 9"/>
    <rect x="0" y="18" width="116" height="56" rx="14" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".2"/>
    <circle cx="22" cy="46" r="7" fill="#D97757"/>
    <text x="38" y="53" font-size="18" font-weight="600" fill="#F3F4F6">Prompt</text>
    <rect x="216" y="-38" width="120" height="56" rx="14" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".2"/>
    <circle cx="238" cy="-10" r="7" fill="#A259FF"/>
    <text x="254" y="-3" font-size="18" font-weight="600" fill="#F3F4F6">Figma</text>
    <rect x="216" y="82" width="116" height="56" rx="14" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".2"/>
    <circle cx="238" cy="110" r="7" fill="#22D3EE"/>
    <text x="254" y="117" font-size="18" font-weight="600" fill="#F3F4F6">Code</text>
  </g>
</svg>
